[build-system]
build-backend = "maturin"
requires = ["maturin>=1.5,<2.0"]

[project]
name = "fibomat"
version = "0.6.0"
description = "fib-o-mat is a toolbox to generate patterns for focused ion beam instruments."
requires-python = ">=3.8"
authors = [
    { name = "Victor Deinhart", email = "victor.deinhart@helmholtz-berlin.de" },
]
keywords = [
    "focused ion beam",
    "fib",
    "pattern",
    "patterning",
    "beam path generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
]
license = { text = "GPLv3" }
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "pint",
    "splipy",
    "jinja2",
    # pyhershey
]


[project.urls]
Repository = "https://github.com/fib-o-mat/fib-o-mat"
Documentation = "https://fib-o-mat.readthedocs.io/en/latest/"

[project.gui-scripts]
beam_simulation = "fibomat.beam_simulation:run"

[project.optional-dependencies]
exporting = [
    "bokeh>=3.8,<4",
    "svgwrite",
    "marshmallow",
    "prettytable",
    "xmltodict",
    "colored",
    "pillow",
]
io = ["svgelements", "ezdxf"]
# features which are not stable or not fully reworked yet (e.g. `fibomat.optimize`, `ContourParallel`)
experimental = ["numba"]
gui = ["pyqt5", "vispy"]
docs = [
    "sphinx>=7.3",
    "pydata-sphinx-theme>=0.16",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxemoji",
    "pyhershey",  # fonts of the Text shape, needed to run the examples
]
testing = ["pytest", "pytest-coverage", "pytest-mock"]
dev = ["bump2version", "twine"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "fibomat._libfibomat"
features = ["extension-module"]

